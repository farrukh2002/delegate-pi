<text x="426.5" y="23" fill="#7d8590" text-anchor="middle" style="font-size:12px">delegate-pi — ask_user</text>
<text x="22.0" y="60" fill="#3d444d" textLength="809.3">────────────────────────────────────────────────────────────────────────────────────────────────</text>
<text x="30.4" y="98" fill="#4493f8" textLength="362.5">Which storage should the session index use?</text>
<text x="47.3" y="136" fill="#e6edf3" textLength="286.6">1. SQLite (one file, fast queries)</text>
<text x="30.4" y="155" fill="#4493f8" textLength="295.1">→ 2. JSON lines (no new dependency)</text>
<text x="47.3" y="174" fill="#e6edf3" textLength="261.3">3. Keep the current folder scan</text>
<text x="47.3" y="193" fill="#e6edf3" textLength="227.6">4. Other — type your answer</text>
<text x="30.4" y="231" fill="#656c76" textLength="16.9">↑↓</text>
<text x="47.3" y="231" fill="#9198a1" textLength="75.9"> navigate</text>
<text x="140.0" y="231" fill="#656c76" textLength="42.1">enter</text>
<text x="182.2" y="231" fill="#9198a1" textLength="59.0"> select</text>
<text x="258.0" y="231" fill="#656c76" textLength="109.6">escape/ctrl+c</text>
<text x="367.6" y="231" fill="#9198a1" textLength="59.0"> cancel</text>
<text x="22.0" y="269" fill="#3d444d" textLength="809.3">────────────────────────────────────────────────────────────────────────────────────────────────</text>
</svg>
