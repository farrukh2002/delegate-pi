name: Build native helpers
description: Build the native binaries for the Linux release archive

inputs:
  arch:
    description: Architecture to build, x64 or arm64. Builds both when it is all.
    default: all

runs:
  using: composite
  steps:
    - name: Install Rust targets
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        case "$ARCH" in
          x64) targets=x86_64-unknown-linux-musl ;;
          arm64) targets=aarch64-unknown-linux-musl ;;
          *) targets="x86_64-unknown-linux-musl aarch64-unknown-linux-musl" ;;
        esac
        rustup target add $targets

    - name: Install Zig
      if: ${{ hashFiles('scripts/build-web.sh') != '' }}
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
      with:
        version: '0.17.1'
        use-cache: false

    - name: Install cargo-zigbuild
      if: ${{ hashFiles('scripts/build-web.sh') != '' }}
      shell: bash
      run: cargo install cargo-zigbuild --version 0.24.1 --locked

    - name: Build native helpers
      shell: bash
      env:
        NATIVE_ARCH: ${{ inputs.arch }}
      run: npm run build:native
