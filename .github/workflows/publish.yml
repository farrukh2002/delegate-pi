name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [dev, rc, stable]
        default: dev

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            packages/image-resize-rs -> target
            packages/delegate-worker-rs -> target
            packages/delegate-hook-rs -> target
            packages/web-rs -> target
          key: release-${{ matrix.arch }}

      - name: Build native helpers
        uses: ./.github/actions/build-native-helpers
        with:
          arch: ${{ matrix.arch }}

      - name: Archive native helpers
        run: >
          tar -cf native-${{ matrix.arch }}.tar
          packages/coding-agent/dist/bin/pi-image-resize-${{ matrix.arch }}
          packages/coding-agent/dist/bin/pi-web-${{ matrix.arch }}
          packages/coding-agent/delegate/bin/delegate-worker-${{ matrix.arch }}
          packages/coding-agent/delegate/bin/child-claude-${{ matrix.arch }}

      - name: Upload native helpers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.arch }}
          path: native-${{ matrix.arch }}.tar
          retention-days: 1

  release:
    needs: native
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ inputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download native helpers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true

      - name: Unpack native helpers
        run: |
          tar -xf native-x64.tar
          tar -xf native-arm64.tar

      - name: Pick the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(node -p 'require("./packages/coding-agent/package.json").version')
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | sed -n "s/^v${base//./\\.}-rc\.\([0-9]*\)$/\1/p" | sort -n | tail -n 1)
          case "$CHANNEL" in
            stable) version="$base"; tag="v$base" ;;
            rc) version="$base-rc.$(( ${last:-0} + 1 ))"; tag="v$version" ;;
            dev) version="$base-dev.${GITHUB_SHA::7}"; tag="dev" ;;
          esac
          if [ "$CHANNEL" != dev ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Raise the version in packages/coding-agent/package.json first."
            exit 1
          fi
          if [ "$version" != "$base" ]; then
            node -e '
              const fs = require("fs");
              const file = "packages/coding-agent/package.json";
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = process.argv[1];
              fs.writeFileSync(file, JSON.stringify(pkg, null, "\t") + "\n");
            ' "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Package
        run: node scripts/build-release.mjs

      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf release/delegate-pi.tar.gz -C "$RUNNER_TEMP/smoke"
          node "$RUNNER_TEMP/smoke/delegate-pi/dist/bundle/cli.js" --version

      - name: Smoke test packaged web engine
        if: ${{ hashFiles('scripts/smoke-test-web-engine.mjs') != '' }}
        run: PI_WEB_BIN="$RUNNER_TEMP/smoke/delegate-pi/dist/bin/pi-web-x64" node scripts/smoke-test-web-engine.mjs

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          assets="release/delegate-pi.tar.gz release/delegate-pi.tar.gz.sha256"
          case "$CHANNEL" in
            stable) install="curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh" ;;
            *) install="curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh -s -- --channel $CHANNEL" ;;
          esac
          notes=$(printf 'delegate-pi %s (%s channel), built from %s.\n\nInstall:\n\n```sh\n%s\n```\n' "$VERSION" "$CHANNEL" "$GITHUB_SHA" "$install")
          case "$CHANNEL" in
            stable)
              gh release create "$TAG" $assets --target "$GITHUB_SHA" --title "delegate-pi $VERSION" --notes "$notes" --latest
              ;;
            rc)
              gh release create "$TAG" $assets --target "$GITHUB_SHA" --title "delegate-pi $VERSION" --notes "$notes" --prerelease --latest=false
              ;;
            dev)
              gh release delete dev --yes --cleanup-tag >/dev/null 2>&1 || true
              gh release create dev $assets --target "$GITHUB_SHA" --title "delegate-pi $VERSION" --notes "$notes" --prerelease --latest=false
              ;;
          esac
