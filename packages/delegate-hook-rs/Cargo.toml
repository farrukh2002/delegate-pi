[package]
name = "delegate-hook"
version = "1.0.0"
edition = "2021"
description = "Claude PreToolUse hook for delegate: parent channel client"

[[bin]]
name = "child-claude"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
