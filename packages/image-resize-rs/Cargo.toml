[package]
name = "pi-image-resize"
version = "1.0.0"
edition = "2021"
description = "Image resize helper for delegate-pi: streaming decode, low memory"

[[bin]]
name = "pi-image-resize"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
jpeg-decoder = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "gif", "bmp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
